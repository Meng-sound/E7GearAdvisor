# =====================================================================
#  第七史诗（Steam 简中版）自动推剧情 —— 规则与视觉配置
#  原理：每轮截图 → OCR 文字识别 + OpenCV 图像识别 → 按顺序匹配首条规则执行
#  所有坐标/区域均使用「窗口相对比例」(0.0 ~ 1.0)，任意窗口大小通用
# =====================================================================

settings:
  click_mode: background          # background=后台窗口消息点击（不移动/不抢你的鼠标，2026-11-08 实机验证可用）；foreground=前台模拟真实鼠标
  capture: auto                   # auto=优先 PrintWindow，黑屏自动回退屏幕截图
  click_hold_ms: [60, 90]       # 每次点击「按住屏幕」的停留时长（毫秒）；游戏识别不到按压就调大（如 [180, 240]）
  click_gap_ms: [100, 150]                # 连点两次之间的间隔（毫秒），越小双击越紧凑
  combat_click_gap_ms: [140, 200]         # 战斗内双击放技能的两下间隔（毫秒）：太小会被游戏吞并，太大连不上
  interval: 0.35                  # 每轮检测间隔（秒）
  min_score: 0.55                 # OCR 识别置信度下限
  default_max_len: 8              # 默认允许点击的最大字数（防止误点长句台词里的词）
  manual_combat: true             # true=手动精控（强力版：留技能打Boss + 烧魂 + 点杀小弟）；false=使用系统AUTO自动战斗
  enable_auto_battle_check: true  # 当 tactical_combat=false 时自动开启 AUTO；当 tactical_combat=true 时编队自动关闭 AUTO
  theater_ticket_cost: 500000     # 月光剧场门票价格（金币/张）
  theater_keep_gold: 1000000      # 买票后希望保留的金币下限（低于该值不再买票 → 自动暂停）
  # 月光剧场节奏（只影响剧场；数值越小越快，太快点空就调大）
  theater_story_click_ms: 50      # 剧情连点间隔（毫秒）
  theater_story_hold_ms: [60, 80]  # 每次按压时长（毫秒）；Steam 版若点不动，程序会自动加长
  theater_story_burst: 12         # 每轮连点次数（之后重新识别一次状态）
  theater_action_gap_ms: 300      # 同一按钮最短间隔（毫秒），防双击误触
  # 红装（85 传说）自动购买：默认关闭，三个条件默认都不勾
  gear_auto_buy: false            # 总开关
  gear_cond_score27: false        # 条件：装备分数 ≥ 27
  gear_cond_speed3: false         # 条件：速度 ≥ 3
  gear_cond_combo: false          # 条件：同时拥有 暴击伤害/暴击/速度
  gear_price: 1400000             # 只认这个价格（85 红装统一价）
  shop_stop_mode: sky             # 秘密商店停止条件：sky / gold / either
  shop_stop_gold: 1000000         # 秘密商店金币停止线
  idle_click_after: 4.5           # 非战斗画面下，连续 N 秒无按钮时轻点画面推进对话/唤出跳过按钮（0=关闭）
  idle_click_at: [0.5, 0.62]      # 推进对话/过场的安全点击位置（避开底部任务图标区）
  cutscene_press_seconds: 3.4     # 动态过场「长按」时长（秒）：实测约 3.3 秒才会出现「跳过」
  save_unknown_after: 20          # 非战斗画面连续 N 秒未识别时，自动存图到 debug/unknown 便于后续校正
  auto_pause_unknown_after: 20    # 非战斗静态画面连续 N 秒无法识别时，自动暂停提醒（0=关闭）
  stuck_repeat: 8                 # 同一规则连续点击 N 次且画面无实质变化 → 判定卡住并暂停报警

# 全局消费保护：屏幕上出现以下词时，立即安全暂停，绝不执行任何点击（防止误花天空石/充值）
global_forbid:
  - "充值"
  - "是否购买"
  - "购买确认"
  - "立即购买"
  - "消耗天空石"
  - "花费天空石"
  - "使用天空石"
  - "天空石不足"

rules:
  # ================ 1. 自动暂停条件（最高优先级，触发后蜂鸣提醒） ================
  - name: 行动力不足
    keywords:
      - "行动力不足"
      - "行动力不够"
      - "体力不足"
      - "补充行动力"
      - "购买行动力"
      - "恢复行动力"
      - "生命之叶"
    max_len: 30
    action: pause

  - name: 背包或栏位已满
    keywords:
      - "背包已满"
      - "装备栏已满"
      - "英雄栏已满"
      - "神器栏已满"
      - "栏位已满"
      - "空间不足"
      - "栏位不足"
      - "超出上限"
      - "整理背包"
      - "扩充栏位"
      - "保管箱"
    max_len: 30
    action: pause

  - name: 战斗失败
    keywords:
      - "战斗失败"
      - "挑战失败"
      - "任务失败"
      - "闯关失败"
      - "作战失败"
      - "失败原因"
      - "成长指南"
      - "可升等"
      - "可配戴装备"
      - "可强化装备"
      - "可强化技能"
      - "DEFEAT"
      - "Defeat"
      - "FAILED"
      - "FAIVLED"
      - "FAIMLED"
    max_len: 20
    action: pause

  # 双重保险：万一团灭界面的艺术字“战斗失败”漏识别，只要出现重开按钮且无胜利/战斗中标志，同样立即暂停
  - name: 战斗失败(按钮兜底)
    keywords:
      - "重新挑战"
      - "再次挑战"
      - "放弃战斗"
    exact: true
    forbid:
      - "MVP"
      - "获得的道具"
      - "完成关卡任务"
      - "关卡任务"
      - "战斗结果"
      - "获得奖励"
      - "准备战斗"
      - "进行任务"
      - "灵魂不足"
    region: [0.15, 0.25, 0.98, 0.98]
    max_len: 10
    action: pause

  # ================ 2. 跳过剧情对话与过场（最快推关） ================
  - name: 确认跳过剧情
    keywords: ["确认", "确定", "是"]
    exact: true
    require_any: ["跳过", "略过", "概要", "梗概"]
    forbid: ["准备战斗", "选择队伍", "进行任务", "给予协助的朋友", "好友申请"]
    region: [0.20, 0.28, 0.95, 0.95]
    cooldown: 0.8

  - name: 跳过剧情
    keywords: ["跳过", "略过", "SKIP", "Skip"]
    exclude: ["教学"]
    max_len: 4
    region: [0.65, 0.0, 1.0, 0.20]
    cooldown: 1.0

  # ================ 2.5 回大厅 → 自动打开主线（防「返回大厅后卡住」） ================
  # 大厅特征：右侧竖排 Episode / 支线故事 / 竞技场 / 召唤 / 商店
  - name: 回大厅打开主线
    keywords: ["Episode", "EPISODE", "Episode "]
    require_any: ["Episode", "支线故事", "竞技场", "召唤", "圣域"]
    forbid: ["准备战斗", "进行任务", "选择队伍", "战斗失败", "放弃战斗", "重新进行"]
    region: [0.78, 0.14, 1.0, 0.42]      # 右侧大按钮「Episode」所在区域
    max_len: 12
    cooldown: 3.0

  # 故事选择页（支线故事 / 月光剧场 / 英雄故事）→ 左上角返回，回到大厅再进主线
  - name: 故事页返回大厅
    keywords: ["支线故事"]
    require_any: ["英雄故事", "月光剧场", "特别的时间之书"]
    forbid: ["准备战斗", "进行任务"]
    region: [0.80, 0.10, 1.0, 0.60]
    max_len: 8
    action: click_at
    at: [0.035, 0.045]
    cooldown: 2.5

  # ================ 3. 迷宫/探索关卡内自动寻路与传送门 ================
  # OpenCV 图像识别：识别十字路口带「橙红火焰光效」的任务目标方向罗盘（N/S/E/W）
  - name: 迷宫方向罗盘
    action: compass
    cooldown: 2.0

  - name: 出口传送门
    keywords: ["传送门", "出口", "下一区域", "前往下一层"]
    exclude: ["请选择", "迷你地图", "标示"]
    max_len: 6
    region: [0.20, 0.15, 0.80, 0.78]
    cooldown: 2.5

  # ================ 4. 结算 / 领奖 / 助战好友申请弹窗关闭 ================
  - name: 关闭好友申请弹窗
    keywords: ["取消"]
    exact: true
    require_any: ["给予协助的朋友", "好友申请", "出借辅助英雄"]
    region: [0.20, 0.50, 0.65, 0.90]
    cooldown: 1.2

  # 第一页通关大金标 CLEAR 画面：只需在画面中央轻点一下即可进入 MVP 结算页
  - name: 通关结算(CLEAR)
    keywords: ["关卡任务", "CLEAR", "CLEA", "LEAR", "EAR"]
    exact: true
    forbid: ["MVP", "获得的道具", "准备战斗", "选择队伍", "进行任务", "跳过"]
    region: [0.10, 0.50, 0.95, 0.90]
    action: click_at
    at: [0.905, 0.878]
    cooldown: 2.0

  # 账号 Rank 提升动画：点画面下方（黑底任意处）或底部箭头都能继续
  - name: 账号Rank提升
    keywords: ["账号Rank提升", "Rank提升", "请继续您的旅程", "RANKUP", "RANK UP"]
    max_len: 20
    action: click_at
    at: [0.500, 0.920]
    cooldown: 2.0

  - name: 点击关闭弹窗
    keywords:
      - "点击关闭"
      - "点击重试"
      - "点击屏幕"
      - "点击任意"
      - "点击空白"
      - "轻触屏幕"
      - "轻触"
      - "TOUCH"
      - "Touch"
    exclude: ["burn", "Burn", "BURN", "燃烧", "灵魂"]
    forbid: ["灵魂不足"]
    max_len: 16
    cooldown: 1.2

  - name: 下一关
    keywords:
      - "下一关"
      - "下一阶段"
      - "下一个关卡"
      - "前往下一"
      - "下一章"
      - "下一地区"
      - "Next"
    max_len: 10
    region: [0.35, 0.40, 1.0, 1.0]
    cooldown: 2.5

  - name: 确认/关闭弹窗
    keywords: ["确认", "确定", "关闭", "好的", "知道了", "完成", "OK", "领取", "移动"]
    exact: true
    region: [0.15, 0.30, 0.98, 0.98]
    cooldown: 1.5

  # ================ 5. 地图进关 / 选助战 / 编队出战 ================
  - name: 进行任务/战斗开始
    keywords: ["进行任务", "战斗开始", "开始战斗", "开始挑战", "出战", "START", "Start"]
    max_len: 8
    region: [0.55, 0.65, 1.0, 1.0]
    cooldown: 2.5

  - name: 准备战斗/选择队伍/观看故事
    keywords:
      - "准备战斗"
      - "观看故事"
      - "阅读故事"
      - "选择队伍"
      - "队伍编成"
      - "进入战斗"
      - "入场"
      - "Select Team"
    max_len: 8
    exclude: ["奖励"]
    region: [0.50, 0.65, 1.0, 1.0]
    cooldown: 2.0

  # ================ 6. 新手引导提示跳过（兜底） ================
  - name: 跳过新手教学
    keywords: ["跳过教学"]
    max_len: 6
    region: [0.70, 0.0, 1.0, 0.15]
    cooldown: 1.5

# =====================================================================
# 平台差异覆盖（可选）：同一份配置，按运行环境覆盖个别 settings
#   steam    = Steam 官方窗口（默认）
#   emulator = MuMu 模拟器（走 IPC 驱动时自动选中）
# 只写「和 Steam 不同」的项，没写的继续用上面 settings 的值。
# 例：
# platform_overrides:
#   emulator:
#     skill_pos: [[0.800, 0.917], [0.878, 0.917], [0.955, 0.917]]
#     theater_story_click_ms: 30
# =====================================================================
platform_overrides: {}
